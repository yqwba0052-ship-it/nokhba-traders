name: nokhba_traders
description: "نخبة المتداولين: متداولون حقيقيون من نسخ التداول في Binance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

# Icon: design/icon.png is the owner's picture; `cvpy tool/make_icon.py` cuts it into
# design/icon_square.png, icon_foreground.png and icon_background.png.
# After changing them run:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "design/icon_square.png"
  adaptive_icon_background: "design/icon_background.png"
  adaptive_icon_foreground: "design/icon_foreground.png"
  min_sdk_android: 21
