name: Build APK and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Next version (v1.0.1, v1.0.2, ...)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
                 | grep -E '^v1\.0\.[0-9]+$' | sed 's/^v1\.0\.//' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "number=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.$next" >> "$GITHUB_OUTPUT"
          echo "Building v1.0.$next"

      - name: Signing key (from repository secrets, never committed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing"; exit 1
          fi
          # Secrets set from Windows may end with \r\n: strip it before use.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/upload-keystore.jks
          pw=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$pw"
            echo "keyAlias=upload"
            echo "keyPassword=$pw"
          } > android/key.properties
          keytool -list -keystore android/upload-keystore.jks -storepass "$pw" -alias upload > /dev/null \
            && echo "Signing key opens correctly"

      - run: flutter pub get
      - run: flutter analyze

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=1.0.${{ steps.version.outputs.number }}
          --build-number=${{ steps.version.outputs.number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk nokhba-traders.apk
          gh release create "${{ steps.version.outputs.tag }}" nokhba-traders.apk \
            --target "${{ github.sha }}" \
            --title "نخبة المتداولين ${{ steps.version.outputs.tag }}" \
            --notes "نسخة أندرويد مبنية تلقائياً من ${{ github.sha }}. حمّل nokhba-traders.apk وثبّته على هاتفك."
